<!-- [C] JAVASCRIPT: one small function, tePick(), that controls the Response / Explanatory -->
<!-- checkboxes in the variable picker. -->
<script>
  // Called by every checkbox in the variable picker (see pick_row() in the setup code).
  //  - only ONE box may be ticked in each column (Response / Explanatory)
  //  - one variable cannot be both Response and Explanatory
  // It then tells the server which variable is in each column (input$sel_pair).
  function tePick(col, box) {
    // 'other' = the opposite column (if this box is in Response, other is Explanatory).
    var other = (col === 'resp') ? 'expl' : 'resp';
    // Untick every other box in this column, so only one is ticked per column.
    document.querySelectorAll('input.pick-' + col).forEach(function (b) { if (b !== box) b.checked = false; });
    // If this variable is ticked in the other column too, untick it there (a variable cannot be
    // both).
    if (box.checked) {
      document.querySelectorAll('input.pick-' + other).forEach(function (b) {
        if (b.dataset.v === box.dataset.v) b.checked = false;
      });
    }
    // chosen(c): the variable ticked in column c, or '' if none is ticked.
    var chosen = function (c) {
      var b = document.querySelector('input.pick-' + c + ':checked');
      return b ? b.dataset.v : '';
    };
    // Send both choices to R; the server receives them as input$sel_pair$resp and
    // input$sel_pair$expl.
    Shiny.setInputValue('sel_pair', { resp: chosen('resp'), expl: chosen('expl') }, { priority: 'event' });
  }
</script>

<script type="application/shiny-prerendered" data-context="server-start">
# ==============================================================
# [D] SETUP  -  runs once when the app starts (shared by all users).
# Loads packages, finds the cleaned .rds files, and defines every
# helper function the app needs.
# ==============================================================
# ---- [D1] Packages and settings  (search for [D1]...[D9] to jump between the parts of this setup section). ----
library(ggplot2)   # graphs
library(shiny)     # the web-app framework
library(readr)     # read_csv(): reads Data/data_dictionary.csv (the tables themselves are .rds)
library(DT)        # interactive, filterable data tables


# ---- Settings you may want to change ------------------------
DATA_DIR   <- "Data"   # folder holding the cleaned .rds files
MAX_LEVELS <- 30       # text variables with MORE distinct values than this are hidden from the analysis picker
TOP_LEVELS <- 10       # in an analysis, only the 10 most common groups are kept; the rest become "Other"
ALPHA      <- 0.05     # significance level used in the written conclusions

# ---- [D2] Find the cleaned tables ---------------------------
# Every .rds in Data/ is one table. Files ending in "_combined"
# are the "Combined" tables; everything else is "Individual".
# (data_dictionary.csv is not an .rds, so it is never mistaken for a table.)
rds_files       <- list.files(DATA_DIR, pattern = "\\.rds$")
all_keys        <- sub("\\.rds$", "", rds_files)
combined_keys   <- all_keys[grepl("_combined$", all_keys)]
individual_keys <- setdiff(all_keys, combined_keys)

# ---- [D3] Table order and display names ----------------------------
# Show tables in the same order as the Tiny Earth database; anything
# not in this list is placed at the end (alphabetical).
preferred_order <- c("institutions", "samples", "dilutions", "library_collections",
                     "aa_screen_libraries", "isolates", "streaks", "aa_screen_isolates",
                     "gram_stains", "other_tests", "rrna_analyses", "antibio_suscepts",
                     "eukaryotics", "extracts", "aa_screen_extracts")
# sort_keys(): puts table names in the preferred order; tables not in the list go last,
# alphabetically.
sort_keys <- function(keys) {
  # Drop '_combined' so a combined table sorts right beside its individual version.
  base <- sub("_combined$", "", keys)
  # match() = position in preferred_order; nomatch = 99 sends unknown tables to the end.
  keys[order(match(base, preferred_order, nomatch = 99L), keys)]
}
# Apply the ordering to both groups of tables.
individual_keys <- sort_keys(individual_keys)
combined_keys   <- sort_keys(combined_keys)

# "antibio_suscepts_combined" -> "Antibio Suscepts"  (label shown to students)
pretty_name <- function(key) tools::toTitleCase(gsub("_", " ", sub("_combined$", "", key)))

# ---- [D4] Load a table (once), then remember it -------------
# `table_cache` is shared by all users, so each file is read from
# disk only the first time anyone opens it. readRDS() returns the table
# exactly as Data_Clean saved it, with every column type intact.
# An environment acts like a shared lookup list: name of table -> data frame.
table_cache <- new.env()
# load_table('isolates') returns that table, reading the file only the first time anyone asks for
# it.
load_table <- function(key) {
  # Not in the cache yet? Then read it from disk.
  if (!exists(key, envir = table_cache, inherits = FALSE)) {
    path <- file.path(DATA_DIR, paste0(key, ".rds"))
    # Read the saved table (types such as Date and TRUE/FALSE come back unchanged).
    df   <- readRDS(path)
    # Store it as a plain data.frame (what DT and the statistics functions expect).
    assign(key, as.data.frame(df), envir = table_cache)
  }
  # Return the cached copy.
  get(key, envir = table_cache, inherits = FALSE)
}

# ---- [D5] Variable descriptions (the "Description" directory) ----
# OPTIONAL file: Data/data_dictionary.csv with 3 columns:
#   table, variable, description
# Whatever you write there is shown in the Variable Directory.
# Start with an empty dictionary so the app still works when the file is missing.
dictionary <- data.frame(table = character(), variable = character(), description = character())
dict_path  <- file.path(DATA_DIR, "data_dictionary.csv")
# If the dictionary file exists, read it with every column as text ('c').
if (file.exists(dict_path)) {
  dictionary <- as.data.frame(readr::read_csv(dict_path, col_types = readr::cols(.default = "c"),
                                              progress = FALSE))
}

# Finds the description for one variable. Order of search:
#  1. same table + same variable name
#  2. same variable name in any table
#  3. combined-table columns that start with "sample_" or "institution_"
#     (look them up in the samples / institutions table without the prefix)
lookup_description <- function(key, var) {
  # Dictionary entries use the plain table name, so drop '_combined'.
  tbl  <- sub("_combined$", "", key)
  # pick(): the first non-blank description in a vector, or NA if there is none.
  pick <- function(d) { d <- d[!is.na(d) & nzchar(d)]; if (length(d)) d[1] else NA_character_ }
  # Rule 1: same table and same variable name.
  out  <- pick(dictionary$description[dictionary$table == tbl & dictionary$variable == var])
  # Rule 2: same variable name in any table.
  if (is.na(out)) out <- pick(dictionary$description[dictionary$variable == var])
  # Rule 3: columns joined in from the samples table start with 'sample_', so look them up without
  # the prefix.
  if (is.na(out) && grepl("^sample_", var))
    out <- pick(dictionary$description[dictionary$table == "samples" & dictionary$variable == sub("^sample_", "", var)])
  # Rule 4: same idea for columns joined in from the institutions table.
  if (is.na(out) && grepl("^institution_", var))
    out <- pick(dictionary$description[dictionary$table == "institutions" & dictionary$variable == sub("^institution_", "", var)])
  # Nothing found: show a reminder instead of a blank.
  if (is.na(out)) "(not yet documented - add it to Data/data_dictionary.csv)" else out
}

# ---- [D6] Variable types and test choice --------------------
# Quantitative = numbers. Qualitative = categories (text or TRUE/FALSE).
# These two types decide which test is run.
var_type <- function(x) {
  # Dates are excluded from analysis; numbers (including counts) are Quantitative; everything else
  # (text, TRUE/FALSE) is Qualitative.
  if (inherits(x, c("Date", "POSIXct"))) "Date"
  else if (is.numeric(x))                "Quantitative"
  else                                   "Qualitative"
}

# Which of the three tests fits a Response / Explanatory pair?
#   quantitative response + qualitative explanatory   -> ANOVA
#   quantitative response + quantitative explanatory  -> simple linear regression
#   qualitative  response + qualitative  explanatory  -> chi-squared test
# Qualitative response + quantitative explanatory has no test in this app, so it returns NA.
pick_test <- function(resp_type, expl_type) {
  if      (resp_type == "Quantitative" && expl_type == "Qualitative")  "anova"
  else if (resp_type == "Quantitative" && expl_type == "Quantitative") "regression"
  else if (resp_type == "Qualitative"  && expl_type == "Qualitative")  "chisq"
  else NA_character_
}

# A more detailed label used only in the Variable Directory.
# describe_type(): the label shown in the Type column of the Variable Directory.
describe_type <- function(name, x) {
  # ID columns only link tables together; label them so students don't analyse them.
  if (name == "id" || grepl("_id$", name)) return("ID (row link)")
  t <- var_type(x)
  # Text with a huge number of different values is flagged (the picker hides these).
  if (t == "Qualitative" && length(unique(stats::na.omit(x))) > MAX_LEVELS) return("Text (many values)")
  t
}

# Which columns of a table are sensible to analyse? We drop ID columns,
# dates, constant columns, and text columns with too many different values
# (a chi-squared table with hundreds of rows is unreadable).
analysis_vars <- function(df) {
  # keep: one TRUE/FALSE per column = should this column be offered in the picker?
  keep <- vapply(names(df), function(v) {
    x <- df[[v]]
    # Drop ID columns.
    if (v == "id" || grepl("_id$", v))      return(FALSE)
    # Drop dates.
    if (var_type(x) == "Date")              return(FALSE)
    # Number of different non-missing values in the column.
    n_unique <- length(unique(stats::na.omit(x)))
    # Drop columns with 0 or 1 different values: nothing to compare.
    if (n_unique < 2)                       return(FALSE)
    # Drop text columns with too many categories.
    if (!is.numeric(x) && n_unique > MAX_LEVELS) return(FALSE)
    TRUE
  }, logical(1))
  # Return the names of the columns that were kept.
  names(df)[keep]
}

# Keeps the TOP_LEVELS most common categories and lumps the rest into "Other".
lump_levels <- function(x, top = TOP_LEVELS) {
  # Work with text so numbers, TRUE/FALSE and factors all behave the same way.
  x      <- as.character(x)
  # Count each category, most common first.
  counts <- sort(table(x), decreasing = TRUE)
  # Only lump when there are more categories than the limit.
  if (length(counts) > top) {
    # The names of the most common categories.
    keep <- names(counts)[seq_len(top)]
    # Everything else becomes 'Other' (missing values stay missing).
    x[!is.na(x) & !(x %in% keep)] <- "Other"
  }
  # Return a factor (R's type for categories).
  factor(x)
}

# ---- [D7] Formatting, table and graph helpers ---------------
# fmt_p(): a p-value as text: blank if missing, '< 0.0001' if tiny, otherwise 4 decimals.
fmt_p <- function(p) ifelse(is.na(p), "", ifelse(p < 0.0001, "< 0.0001", formatC(p, format = "f", digits = 4)))
# fmt_n(): a number as text with d decimals (default 3).
fmt_n <- function(x, d = 3) formatC(x, format = "f", digits = d)

# Turns a data.frame into a tidy HTML table (used in the results page).
html_table <- function(df, caption = NULL) {
  # fmt_col(): formats one column. Numbers: rounded to 3 decimals with thousands commas, NA shown
  # blank. Anything else: shown as text.
  fmt_col <- function(col) {
    if (is.numeric(col)) {
      out <- format(round(col, 3), trim = TRUE, scientific = FALSE, big.mark = ",")
      out[is.na(col)] <- ""
    } else {
      out <- as.character(col); out[is.na(out)] <- ""
    }
    out
  }
  # Apply fmt_col to every column (df[] keeps the data.frame shape).
  df[] <- lapply(df, fmt_col)
  # Build the HTML: optional caption, then a <table> with a header row and one row per data row.
  tags$div(class = "tbl-wrap",
    if (!is.null(caption)) tags$div(class = "tbl-cap", caption),
    tags$table(class = "te-table",
      tags$thead(tags$tr(lapply(names(df), tags$th))),
      tags$tbody(lapply(seq_len(nrow(df)), function(i) tags$tr(lapply(df[i, ], tags$td))))))
}

# ---- Graph theme + sea-green -> cyan colour ramp ------------
# te_cols(n): n colours blending from sea green to cyan (used to colour groups in graphs).
te_cols  <- function(n) grDevices::colorRampPalette(c("#2E8B57", "#20B2AA", "#00BCD4"))(max(n, 1))
# te_theme(): the common graph look (clean white background, bold green title).
te_theme <- function() {
  theme_minimal(base_size = 13) +
    theme(plot.title = element_text(face = "bold", colour = "#1B5E4B"),
          panel.grid.minor = element_blank(),
          legend.position = "right")
}

# Diagnostic graphs shared by ANOVA and regression
qq_plot <- function(res, title = "Normal Q-Q Plot of Residuals") {
  # Q-Q plot: if the residuals are normal, the points follow the line.
  ggplot(data.frame(r = res), aes(sample = r)) +
    stat_qq(colour = "#20B2AA", alpha = .6) + stat_qq_line(colour = "#2E8B57", linewidth = 1) +
    labs(title = title, x = "Theoretical Quantiles", y = "Sample Quantiles (Residuals)") + te_theme()
}
resid_plot <- function(fitted, res, jitter = FALSE) {
  # Sideways jitter width = 3% of the fitted-value range (fallback value if the range is 0).
  w <- 0.03 * diff(range(fitted)); if (!is.finite(w) || w == 0) w <- 0.01
  # Residuals vs. fitted values, with a dashed line at 0.
  p <- ggplot(data.frame(f = fitted, r = res), aes(f, r)) +
    geom_hline(yintercept = 0, linetype = "dashed", colour = "#1B5E4B")
  # ANOVA fitted values repeat for each group, so jitter spreads the points sideways; regression
  # uses plain points.
  p <- p + if (jitter) geom_jitter(width = w, height = 0, colour = "#20B2AA", alpha = .45)
           else        geom_point(colour = "#20B2AA", alpha = .45)
  # Add labels and the theme, then return the plot.
  p + labs(title = "Residuals vs. Fitted Values", x = "Fitted Values", y = "Residuals") + te_theme()
}

# Shapiro-Wilk normality test that never crashes (it only accepts 3-5000 values)
safe_shapiro <- function(x) {
  # Remove missing and infinite values.
  x <- x[is.finite(x)]
  # shapiro.test() accepts at most 5000 values, so use a reproducible random sample of 5000.
  if (length(x) > 5000) { set.seed(1); x <- sample(x, 5000) }
  # Return NULL instead of an error if the test cannot run (e.g. all values identical).
  tryCatch(stats::shapiro.test(x), error = function(e) NULL)
}
# interp(): plain-English reading of a diagnostic p-value (p at or above ALPHA = no evidence the
# assumption is broken).
interp <- function(p) ifelse(is.na(p), "Could not be computed",
                      ifelse(p >= ALPHA, "No evidence of a violation", "Possible violation - interpret with caution"))

# Written conclusion shown under each test:
# reject_txt is shown when p < ALPHA, fail_txt when it is not.
conclusion_ui <- function(p, reject_txt, fail_txt) {
  # Choose the sentence: p missing / reject H0 (p < ALPHA) / fail to reject H0. Subscript zero is
  # written as a Unicode escape.
  txt <- if (is.na(p)) "The p-value could not be computed."
         else if (p < ALPHA) sprintf("The p-value (%s) is less than %.2f, so we reject H\u2080. %s", fmt_p(p), ALPHA, reject_txt)
         else sprintf("The p-value (%s) is not less than %.2f, so we fail to reject H\u2080. %s", fmt_p(p), ALPHA, fail_txt)
  tags$p(class = "concl", tags$strong(sprintf("Conclusion (\u03b1 = %.2f): ", ALPHA)), txt)
}

# ==============================================================
# >>>>>>>>>>>>  [D8] DESIGNER SECTION  (statistics)  <<<<<<<<<<<<
# Per the project plan, the statistics code and the test
# explanations are meant to be written/owned by the project
# designer. What follows is a working, plain-R starting point:
# one analysis function per test, plus the explanation text.
# Replace or rewrite any of it - the rest of the app only needs
# each function to return the same named list (see ANOVA below).
# ==============================================================

# ---------- 1. ANOVA: quantitative response + qualitative explanatory ----------
# yvar = quantitative response column name; gvar = qualitative grouping column name. Returns a named
# list (type, title, main_plot, summary_ui, test_ui, diag_plots, diag_ui): the 'contract' the
# results page expects from every analyse_* function.
analyse_anova <- function(df, yvar, gvar) {
  # Number of groups before lumping (used for the note below).
  n_orig <- length(unique(stats::na.omit(df[[gvar]])))
  # Working table: y = the numbers, g = the group (rare groups lumped into 'Other').
  d <- data.frame(y = df[[yvar]], g = lump_levels(df[[gvar]]))
  # Keep only rows where both values are present.
  d <- d[stats::complete.cases(d), ]
  # a group needs at least 2 observations to estimate spread
  d <- d[d$g %in% names(which(table(d$g) >= 2)), ]
  # Forget group labels that no longer have any rows.
  d$g <- droplevels(d$g)
  # validate(need()) stops with a friendly on-screen message when ANOVA cannot be run.
  validate(need(nlevels(d$g) >= 2 && nrow(d) > nlevels(d$g),
                "ANOVA needs at least two groups that each have 2 or more observations."))

  # Fit the ANOVA model: y explained by group.
  fit  <- stats::aov(y ~ g, data = d)
  # The ANOVA table as a data frame.
  tab  <- summary(fit)[[1]]
  # p-value of the F-test.
  pval <- tab$`Pr(>F)`[1]
  # Residuals (each value minus its group mean); the diagnostics use these.
  res  <- stats::resid(fit)

  # Graph: boxplots + (thinned) raw points + white diamond = group mean
  pts  <- if (nrow(d) > 4000) d[sample(nrow(d), 4000), ] else d
  main_plot <- ggplot(d, aes(g, y, fill = g)) +
    geom_boxplot(alpha = .55, outlier.shape = NA) +
    geom_jitter(data = pts, width = .15, alpha = .25, size = .8, colour = "#1B5E4B") +
    stat_summary(fun = mean, geom = "point", shape = 23, size = 3, fill = "white") +
    scale_fill_manual(values = te_cols(nlevels(d$g))) + guides(fill = "none") +
    labs(title = paste(yvar, "by", gvar), x = gvar, y = yvar,
         caption = "White diamond = group mean") + te_theme() +
    theme(axis.text.x = element_text(angle = 40, hjust = 1))

  # Numerical summary by group
  # One row per group: n, mean, sd, median, min, max.
  by_g <- do.call(rbind, lapply(split(d$y, d$g), function(v)
    data.frame(n = length(v), mean = mean(v), sd = stats::sd(v), median = stats::median(v),
               min = min(v), max = max(v))))
  # Put the group names into their own column.
  by_g <- cbind(Group = rownames(by_g), by_g)
  # A note is only shown when groups were lumped into 'Other'.
  note <- NULL
  if (n_orig > TOP_LEVELS) note <- sprintf("%s has %d different values; only the %d most common are kept and the rest are grouped as \"Other\".", gvar, n_orig, TOP_LEVELS)

  # ANOVA table + diagnostic tests
  anova_tbl <- data.frame(Source = c("Between groups", "Within groups (Residuals)"),
                          Df = tab$Df, `Sum Sq` = tab$`Sum Sq`, `Mean Sq` = tab$`Mean Sq`,
                          `F value` = c(tab$`F value`[1], NA), `p-value` = c(fmt_p(pval), ""),
                          check.names = FALSE)
  # Shapiro-Wilk: are the residuals normal?
  sw  <- safe_shapiro(res)
  z   <- abs(d$y - stats::ave(d$y, d$g, FUN = stats::median))      # Brown-Forsythe = Levene using medians
  # An ANOVA on those distances is the Brown-Forsythe test: do the groups have equal spread?
  bf  <- stats::anova(stats::lm(z ~ d$g))
  # Table of the two assumption checks, each with a plain-English reading.
  diag_tbl <- data.frame(
    Test = c("Shapiro-Wilk (residuals are normal)", "Brown-Forsythe / Levene (equal variances)"),
    Statistic = c(if (is.null(sw)) NA else unname(sw$statistic), bf$`F value`[1]),
    `p-value` = fmt_p(c(if (is.null(sw)) NA else sw$p.value, bf$`Pr(>F)`[1])),
    Interpretation = interp(c(if (is.null(sw)) NA else sw$p.value, bf$`Pr(>F)`[1])),
    check.names = FALSE)

  # Hand everything back to the results page (see the 'contract' note at the top of this function).
  list(type = "anova", title = paste("ANOVA:", yvar, "by", gvar),
       main_plot = main_plot,
       summary_ui = tagList(html_table(by_g, paste("Summary of", yvar, "for each", gvar, "group")),
                            if (!is.null(note)) tags$p(class = "note", note)),
       test_ui = tagList(html_table(anova_tbl, "ANOVA table"),
                         conclusion_ui(pval, "At least one group mean differs from the others.",
                                       "There is not enough evidence that any group mean differs.")),
       diag_plots = list(qq_plot(res), resid_plot(stats::fitted(fit), res, jitter = TRUE)),
       diag_ui = tagList(html_table(diag_tbl, "Assumption checks"),
                         tags$p(class = "note", "With very large samples these tests flag tiny, unimportant departures - judge the plots too.")))
}

# ---------- 2. Simple linear regression: quantitative + quantitative ----------
# yvar = response column name; xvar = explanatory column name (both quantitative). Returns the same
# named list as analyse_anova().
analyse_regression <- function(df, yvar, xvar) {
  # Working table: y = response, x = explanatory.
  d <- data.frame(y = df[[yvar]], x = df[[xvar]])
  d <- d[stats::complete.cases(d), ]
  # Need at least 3 complete rows, and both variables must vary, or a line cannot be fitted.
  validate(need(nrow(d) >= 3 && stats::sd(d$x) > 0 && stats::sd(d$y) > 0,
                "Regression needs at least 3 complete observations where both variables vary."))
  # Fit the straight-line model.
  fit <- stats::lm(y ~ x, data = d)
  # Summary of the fit: coefficients, R-squared, F-statistic.
  s   <- summary(fit)
  # Coefficient table (estimate, std. error, t, p) for the intercept and slope.
  cf  <- s$coefficients
  # 95% confidence intervals for the coefficients.
  ci  <- stats::confint(fit)
  # Residuals (observed minus predicted).
  res <- stats::resid(fit)
  # p-value of the overall F-test.
  fp  <- stats::pf(s$fstatistic[1], s$fstatistic[2], s$fstatistic[3], lower.tail = FALSE)

  # Graph: scatterplot (fainter when there are many points) with the least-squares line and its
  # confidence band.
  main_plot <- ggplot(d, aes(x, y)) +
    geom_point(colour = "#20B2AA", alpha = if (nrow(d) > 500) .3 else .6) +
    geom_smooth(method = "lm", formula = y ~ x, colour = "#2E8B57", fill = "#00BCD4", alpha = .25) +
    labs(title = paste(yvar, "vs.", xvar), x = xvar, y = yvar,
         caption = "Line = least-squares fit; band = 95% confidence interval for the mean") + te_theme()

  # Descriptive statistics for both variables.
  desc <- do.call(rbind, lapply(c(yvar, xvar), function(nm) {
    v <- d[[if (nm == yvar) "y" else "x"]]
    data.frame(Variable = paste0(nm, if (nm == yvar) " (response)" else " (explanatory)"),
               n = length(v), mean = mean(v), sd = stats::sd(v), median = stats::median(v),
               min = min(v), max = max(v))
  }))
  # Strength of the fit: correlation, R-squared, adjusted R-squared, residual standard error.
  fit_tbl <- data.frame(Statistic = c("Correlation (r)", "R\u00b2", "Adjusted R\u00b2", "Residual standard error"),
                        Value = c(stats::cor(d$x, d$y), s$r.squared, s$adj.r.squared, s$sigma))
  # Coefficient table for display (Greek letters are written as Unicode escapes).
  coef_tbl <- data.frame(Term = c("Intercept (\u03b2\u2080)", paste0("Slope (\u03b2\u2081): ", xvar)),
                         Estimate = cf[, 1], `Std. Error` = cf[, 2], `t value` = cf[, 3],
                         `p-value` = fmt_p(cf[, 4]), `95% CI Lower` = ci[, 1], `95% CI Upper` = ci[, 2],
                         check.names = FALSE)
  # Shapiro-Wilk: are the residuals normal?
  sw <- safe_shapiro(res)
  # Spearman correlation of |residuals| with fitted values: near 0 means the spread is constant.
  sp <- tryCatch(suppressWarnings(stats::cor.test(abs(res), stats::fitted(fit), method = "spearman", exact = FALSE)),
                 error = function(e) NULL)
  # Table of the two assumption checks, each with a plain-English reading.
  diag_tbl <- data.frame(
    Test = c("Shapiro-Wilk (residuals are normal)", "Spearman: |residuals| vs fitted (constant spread)"),
    Statistic = c(if (is.null(sw)) NA else unname(sw$statistic), if (is.null(sp)) NA else unname(sp$estimate)),
    `p-value` = fmt_p(c(if (is.null(sw)) NA else sw$p.value, if (is.null(sp)) NA else sp$p.value)),
    Interpretation = interp(c(if (is.null(sw)) NA else sw$p.value, if (is.null(sp)) NA else sp$p.value)),
    check.names = FALSE)

  # Hand everything back to the results page.
  list(type = "regression", title = paste("Simple Linear Regression:", yvar, "on", xvar),
       main_plot = main_plot,
       summary_ui = tagList(html_table(desc, "Descriptive statistics"), html_table(fit_tbl, "Strength of the linear relationship")),
       test_ui = tagList(html_table(coef_tbl, "Regression coefficients"),
                         tags$p(sprintf("Overall model F-test: F = %s on %d and %d df, p-value %s",
                                        fmt_n(s$fstatistic[1]), s$fstatistic[2], s$fstatistic[3], fmt_p(fp))),
                         conclusion_ui(cf[2, 4], "There is evidence of a linear relationship between the two variables.",
                                       "There is not enough evidence of a linear relationship.")),
       diag_plots = list(resid_plot(stats::fitted(fit), res), qq_plot(res)),
       diag_ui = tagList(html_table(diag_tbl, "Assumption checks"),
                         tags$p(class = "note", "Also check the Residuals vs. Fitted plot: a random cloud around 0 supports linearity and equal spread.")))
}

# ---------- 3. Chi-squared test of independence: qualitative + qualitative ----------
# v1 = ROW variable (the app passes the explanatory variable); v2 = COLUMN variable (the response).
# Both qualitative. Returns the same named list as analyse_anova().
analyse_chisq <- function(df, v1, v2) {
  # Number of categories before lumping (used for the note below).
  n1 <- length(unique(stats::na.omit(df[[v1]]))); n2 <- length(unique(stats::na.omit(df[[v2]])))
  # Working table: a = first variable, b = second (rare categories lumped into 'Other').
  d  <- data.frame(a = lump_levels(df[[v1]]), b = lump_levels(df[[v2]]))
  n_all <- nrow(d)                                  # every row in the table
  d  <- d[stats::complete.cases(d), ]               # the test only uses rows where BOTH variables are filled in
  # Forget category labels that no longer have any rows.
  d$a <- droplevels(d$a); d$b <- droplevels(d$b)
  if (nlevels(d$a) < 2 || nlevels(d$b) < 2 || nrow(d) == 0) {
    # Explain WHY: a variable can look varied on its own yet be left with one category once the
    # rows where the other variable is blank are removed (e.g. soil_type is only filled in for soil samples).
    left <- function(f, nm) if (nlevels(f) == 1) sprintf("%s has only one category (\"%s\")", nm, levels(f))
                            else sprintf("%s has %d categories", nm, nlevels(f))
    validate(need(FALSE, sprintf(
      "The chi-squared test needs at least two categories in each variable, using only rows where both are filled in. Only %s of %s rows have both %s and %s filled in; among those rows, %s and %s.",
      format(nrow(d), big.mark = ","), format(n_all, big.mark = ","), v1, v2, left(d$a, v1), left(d$b, v2))))
  }
  # Contingency table: the count for every combination of categories.
  tab  <- table(d$a, d$b)
  # Run the test (no continuity correction). Small-count warnings are reported by our own check
  # below.
  test <- suppressWarnings(stats::chisq.test(tab, correct = FALSE))
  # Counts we would expect if the variables were independent.
  expd <- test$expected
  # How many cells have an expected count below 5.
  low  <- sum(expd < 5)
  # Total sample size.
  n    <- sum(tab)
  cv   <- sqrt(unname(test$statistic) / (n * min(nrow(tab) - 1, ncol(tab) - 1)))   # Cramer's V
  # A note is only shown when categories were lumped into 'Other'.
  note <- NULL
  if (max(n1, n2) > TOP_LEVELS) note <- sprintf("Variables with more than %d categories keep only their %d most common; the rest are grouped as \"Other\".", TOP_LEVELS, TOP_LEVELS)

  # Graph: stacked 100% bars; each bar is one category of v1, split by v2.
  plot_df <- as.data.frame(tab, stringsAsFactors = FALSE); names(plot_df) <- c("a", "b", "n")
  main_plot <- ggplot(plot_df, aes(a, n, fill = b)) +
    geom_col(position = "fill", colour = "white") +
    scale_fill_manual(values = te_cols(nlevels(d$b))) +
    scale_y_continuous(labels = scales::percent) +
    labs(title = paste(v2, "within each", v1), x = v1, y = "Percent of row", fill = v2) + te_theme() +
    theme(axis.text.x = element_text(angle = 40, hjust = 1))

  # Counts table including row and column totals.
  with_margins <- as.data.frame.matrix(stats::addmargins(tab))
  counts_tbl   <- cbind(Level = rownames(with_margins), with_margins)
  # Row percentages (each row adds to 100).
  pct          <- as.data.frame.matrix(round(100 * prop.table(tab, 1), 1))
  pct_tbl      <- cbind(Level = rownames(pct), pct)

  # Test results table: statistic, degrees of freedom, p-value, Cramer's V (effect size), n.
  test_tbl <- data.frame(Statistic = c("Chi-squared (\u03c7\u00b2)", "Degrees of freedom", "p-value", "Cram\u00e9r's V (effect size, 0-1)", "Sample size (n)"),
                         Value = c(fmt_n(test$statistic), as.character(test$parameter), fmt_p(test$p.value), fmt_n(cv), as.character(n)))
  # Optional note with a Monte Carlo (simulation-based) p-value, used when many expected counts are
  # small.
  mc <- NULL
  if (low / length(expd) > 0.2) {       # too many small expected counts -> also give a simulation-based p-value
    set.seed(1)
    mcp <- stats::chisq.test(tab, simulate.p.value = TRUE, B = 5000)$p.value
    mc  <- tags$p(class = "note", sprintf("Because %d%% of cells have an expected count below 5, a simulation-based (Monte Carlo) p-value is also given: %s.", round(100 * low / length(expd)), fmt_p(mcp)))
  }
  # Expected counts, formatted for display.
  exp_df  <- as.data.frame.matrix(round(expd, 2));  exp_tbl <- cbind(Level = rownames(exp_df), exp_df)
  # Standardized residuals: how strongly each cell departs from independence (beyond about 2 = a
  # lot).
  sres_m  <- test$stdres
  sres_df <- as.data.frame.matrix(round(sres_m, 2)); sres_tbl <- cbind(Level = rownames(sres_df), sres_df)
  # Reshape the residuals into one row per cell so ggplot can draw them.
  heat_df <- as.data.frame(as.table(sres_m), stringsAsFactors = FALSE); names(heat_df) <- c("a", "b", "z")
  # Diagnostic graph: heat map of the standardized residuals.
  heat <- ggplot(heat_df, aes(b, a, fill = z)) + geom_tile(colour = "white") +
    geom_text(aes(label = round(z, 1)), size = 3.2) +
    scale_fill_gradient2(low = "#00ACC1", mid = "white", high = "#2E8B57", midpoint = 0, name = "Std.\nresidual") +
    labs(title = "Standardized Residuals", x = v2, y = v1) + te_theme() +
    theme(axis.text.x = element_text(angle = 40, hjust = 1), panel.grid = element_blank())

  # Hand everything back to the results page.
  list(type = "chisq", title = paste("Chi-squared Test of Independence:", v1, "and", v2),
       main_plot = main_plot,
       summary_ui = tagList(html_table(counts_tbl, sprintf("Counts (rows: %s; columns: %s)", v1, v2)),
                            html_table(pct_tbl, "Row percentages (each row adds to 100%)"),
                            if (!is.null(note)) tags$p(class = "note", note)),
       test_ui = tagList(html_table(test_tbl, "Chi-squared test"), mc,
                         conclusion_ui(test$p.value, "The two variables appear to be associated.",
                                       "There is not enough evidence that the variables are associated.")),
       diag_plots = list(heat),
       diag_ui = tagList(
         tags$p(sprintf("Cells with expected count below 5: %d of %d (%.0f%%). Smallest expected count: %s.",
                        low, length(expd), 100 * low / length(expd), fmt_n(min(expd), 2))),
         tags$p(class = "note", "Rule of thumb: all expected counts should be at least 1, and at least 80% should be 5 or more."),
         html_table(exp_tbl, "Expected counts (if the variables were independent)"),
         html_table(sres_tbl, "Standardized residuals (beyond about \u00b12 = cell contributes strongly)")))
}

# test_info: the text for each test (name, when it is used, purpose, equations, hypotheses,
# assumptions). Edit it here to change what 'View More on Test' and 'Learn More' show. \uXXXX codes
# are Unicode symbols (Greek letters, subscripts).
test_info <- list(
  anova = list(

    purpose = "ANOVA asks whether the average of a quantitative variable differs between the groups (levels) of a categorical variable, by comparing how much the group means vary from each other to how much individual values vary within each group.",
    model = c("y\u1d62\u2c7c = \u03bc + \u03c4\u1d62 + \u03b5\u1d62\u2c7c,   \u03b5\u1d62\u2c7c ~ N(0, \u03c3\u00b2)",
              "y\u1d62\u2c7c = observation j in group i;  \u03bc = overall mean;  \u03c4\u1d62 = effect of group i;  \u03b5\u1d62\u2c7c = random error",
              "F = MSG / MSE = (between-group variation) / (within-group variation)"),
    hypotheses = c("H\u2080: \u03bc\u2081 = \u03bc\u2082 = \u2026 = \u03bc\u2096  (all group means are equal)", "H\u2090: at least one group mean is different"),
    assumptions = "Observations are independent; residuals are approximately normal (Q-Q plot, Shapiro-Wilk); groups have similar spread (residuals vs. fitted, Brown-Forsythe)."),
  regression = list(

    purpose = "Simple linear regression fits a straight line that describes how the response variable changes, on average, as the explanatory variable increases, and tests whether that relationship is real or could be due to chance.",
    model = c("y\u1d62 = \u03b2\u2080 + \u03b2\u2081x\u1d62 + \u03b5\u1d62,   \u03b5\u1d62 ~ N(0, \u03c3\u00b2)",
              "\u03b2\u2080 = intercept;  \u03b2\u2081 = slope (change in y for each 1-unit increase in x);  \u03b5\u1d62 = random error",
              "t = b\u2081 / SE(b\u2081);   R\u00b2 = proportion of the variation in y explained by x"),
    hypotheses = c("H\u2080: \u03b2\u2081 = 0  (no linear relationship)", "H\u2090: \u03b2\u2081 \u2260 0  (a linear relationship exists)"),
    assumptions = "The relationship is linear; observations are independent; residuals are approximately normal (Q-Q plot, Shapiro-Wilk); residual spread is constant (residuals vs. fitted)."),
  chisq = list(
    name = "Chi-squared Test of Independence",
    when = "Both variables are qualitative (categorical).",
    purpose = "The chi-squared test checks whether two categorical variables are related, by comparing the counts we observed in each combination of categories with the counts we would expect if the variables were unrelated.",
    model = c("E\u1d62\u2c7c = (row total i \u00d7 column total j) / n",
              "\u03c7\u00b2 = \u03a3 (O\u1d62\u2c7c \u2212 E\u1d62\u2c7c)\u00b2 / E\u1d62\u2c7c,   df = (rows \u2212 1)(columns \u2212 1)",
              "O = observed count;  E = expected count if independent"),
    hypotheses = c("H\u2080: the two variables are independent (not associated)", "H\u2090: the two variables are associated"),
    assumptions = "Observations are independent; each observation falls in exactly one cell; expected counts are large enough (all \u2265 1 and at least 80% \u2265 5).")
)

# Builds the explanation block for one test
info_ui <- function(type) {
  # Pick the entry for this test.
  i <- test_info[[type]]
  # Banner at the top, then an empty placeholder named 'page' that the server fills in (viewer or
  # results).
  tagList(
    tags$p(tags$strong("When it is used: "), i$when),
    tags$p(tags$strong("Purpose: "), i$purpose),
    tags$p(tags$strong("Mathematical model:")), lapply(i$model, function(m) tags$div(class = "formula", m)),
    tags$p(tags$strong("Hypotheses:"), style = "margin-top:10px;"), lapply(i$hypotheses, function(m) tags$div(class = "formula", m)),
    tags$p(tags$strong("Assumptions (diagnostics): "), i$assumptions, style = "margin-top:10px;"))
}

# >>>>>>>>>>>>>>>>>>>>>>>>  END DESIGNER SECTION  <<<<<<<<<<<<<<<<<<<<<<<<

# ---- [D9] Helpers that build pieces of the page -------------
# One clickable row in the Table Selector. Clicking sends the table's
# name to the server as input$pick_table. The selected row is highlighted.
# selector_item(): one table name in the selector.
selector_item <- function(key, active) {
  tags$a(href = "#", class = paste("te-item", if (active) "active"),
         onclick = sprintf("Shiny.setInputValue('pick_table', '%s', {priority: 'event'}); return false;", key),
         pretty_name(key))
}

# A collapsible section of the selector (click the heading to open / close it).
# `id` names the section so the server can remember whether it was left open,
# `open` is that remembered state, and `...` is the content inside the section.
selector_details <- function(id, title, open, ...) {
  tags$details(class = "sel-details", open = if (open) NA,
               ontoggle = sprintf("Shiny.setInputValue('sec_%s', this.open);", id),
               tags$summary(class = "sel-head", title), ...)
}
selector_section <- function(id, title, keys, current, open = TRUE) {
  selector_details(id, title, open,
                   if (length(keys)) lapply(keys, function(k) selector_item(k, k == current))
                   else tags$p(class = "hint", "No tables found."))
}

# One row of the variable picker: the variable name, then a checkbox in the
# Response column and a checkbox in the Explanatory column. Ticking calls tePick() (JavaScript above).
pick_row <- function(v, type, is_resp, is_expl) {
  # box(): one checkbox. data-v holds the variable name for tePick(); 'checked' restores an earlier
  # tick.
  box <- function(col, on) tags$input(type = "checkbox", class = paste0("pick-", col), `data-v` = v,
                                      checked = if (on) NA, onclick = sprintf("tePick('%s', this);", col))
  div(class = "pick-row",
      span(class = "pick-name", v, span(class = "vtype", paste0("(", type, ")"))),
      box("resp", is_resp), box("expl", is_expl))
}
</script>
 
<script type="application/shiny-prerendered" data-context="server">
# ==============================================================
# [F] SERVER  -  runs separately for EACH visitor, so one student's
# clicks never affect another student's session.
# ==============================================================

# ---- [F1] This visitor's app state --------------------------
#   page     : "viewer" (data viewer) or "results" (analysis page)
#   mode     : "browse" (table selector) or "select" (pick two variables)
#   view     : "table" (Table Viewer) or "description" (Variable Directory)
#   table    : the table currently selected
#   resp     : the variable ticked in the Response column ("" = none yet)
#   expl     : the variable ticked in the Explanatory column ("" = none yet)
#   analysis : the table + response + explanatory variable sent to the results page
rv <- reactiveValues(page = "viewer", mode = "browse", view = "table",
                     table = if (length(individual_keys)) individual_keys[1] else all_keys[1],
                     resp = "", expl = "", analysis = NULL)

# current_df(): the data frame of the selected table. A reactive re-runs by itself whenever rv$table
# changes.
current_df   <- reactive({ req(rv$table); load_table(rv$table) })
# table_label(): text such as 'Samples (Individual)' used in headings.
table_label  <- reactive({ req(rv$table); paste0(pretty_name(rv$table), if (grepl("_combined$", rv$table)) " (Combined)" else " (Individual)") })

# ---- [F2] Which page is showing -----------------------------
output$page <- renderUI({
  # No .rds files found: show instructions instead of the app.
  if (length(all_keys) == 0)
    return(div(class = "panel-card", h4("No data found"),
               p("The Data folder has no .rds files yet. Run the Data_Clean script first, then restart the app.")))
  # Viewer: selector / picker card on the left (left_ui), table card on the right (right_ui).
  if (rv$page == "viewer")
    div(class = "app-grid",
        div(uiOutput("left_ui")),
        div(uiOutput("right_ui")))
  else
    # Otherwise show the analysis page.
    uiOutput("results_ui")
})

# ---- [F3] LEFT PANEL: table selector  OR  variable picker ----
output$left_ui <- renderUI({
  # browse = Table Selector; select = variable picker (the else branch below).
  if (rv$mode == "browse") {
    # ---- Table Selector ----
    # Each table section is collapsible. Whether it is open is remembered in input$sec_<id>
    # (isolate() = read it now without re-drawing the panel each time one is toggled).
    is_open <- function(id) { v <- isolate(input[[paste0("sec_", id)]]); is.null(v) || isTRUE(v) }
    div(class = "panel-card left-card",
        actionButton("btn_background", "Background", class = "btn-te btn-wide"),
        div(class = "selector-scroll",
            div(class = "sel-title", style = "margin-top:10px;", "Table Selector"),
            selector_section("Individual", "Individual", individual_keys, rv$table, is_open("Individual")),
            selector_section("Combined",   "Combined",   combined_keys,   rv$table, is_open("Combined"))),
        # Bottom row: Description (left) and Run Analysis (right). Description shows / hides the
        # Variable Directory for the selected table; it is filled in (solid green) while that view is open.
        div(class = "btn-row",
            actionButton("btn_desc", "Description", title = "Describe every variable in the selected table",
                         class = paste("btn-te", if (rv$view != "description") "btn-outline")),
            actionButton("btn_run", "Run Analysis", class = "btn-te btn-cyan")))
  } else {
    # ---- Variable picker (same card layout as the selector) ----
    # Two checkbox columns sit beside every variable: Response (y) and Explanatory (x).
    # isolate() restores earlier ticks without re-drawing the panel on every click.
    df   <- current_df()
    # Columns worth analysing (see analysis_vars()).
    vars <- analysis_vars(df)
    div(class = "panel-card left-card",
        div(class = "sel-title", "Select two variables"),
        p(class = "hint", paste("Table:", table_label())),
        p(class = "hint", "Tick one Response (y) and one Explanatory (x) variable."),
        div(class = "selector-scroll",
            div(class = "pick-head", span("Variable"), span(class = "h-resp", "Response (y)"), span(class = "h-expl", "Explanatory (x)")),
            lapply(vars, function(v) pick_row(v, var_type(df[[v]]), v == isolate(rv$resp), v == isolate(rv$expl)))),
        uiOutput("sel_status"),
        div(class = "btn-row",
            actionButton("btn_back", "Back", class = "btn-te btn-outline"),
            uiOutput("analyse_btn", inline = TRUE)))
  }
})

# ---- [F4] Variable picker status and Analyse button ----------------
# Which test fits the ticked pair? NA until both columns have a variable (or if no test fits).
pair_test <- reactive({
  df <- current_df()
  if (!nzchar(rv$resp) || !nzchar(rv$expl)) return(NA_character_)
  pick_test(var_type(df[[rv$resp]]), var_type(df[[rv$expl]]))
})

# Message under the variable list: progress, a warning for a pair with no test, or the test that will run
output$sel_status <- renderUI({
  # How many columns have a tick: 0, 1 or 2.
  n <- (nzchar(rv$resp)) + (nzchar(rv$expl))
  if (n < 2)                p(class = "hint", sprintf("%d of 2 selected", n))
  else if (is.na(pair_test())) p(class = "concl", "A qualitative response with a quantitative explanatory variable has no matching test in this app. Swap the columns or choose different variables.")
  else                      p(class = "hint", "Ready: ", tags$strong(test_info[[pair_test()]]$name))
})

# "Analyse" is greyed out until a valid Response + Explanatory pair is ticked, then lights up
output$analyse_btn <- renderUI({
  if (!is.na(pair_test())) actionButton("btn_analyse", "Analyse", class = "btn-te btn-glow")
  else actionButton("btn_analyse", "Analyse", class = "btn-te", disabled = "disabled")
})

# ---- [F5] RIGHT PANEL: Table Viewer  OR  Variable Directory --
output$right_ui <- renderUI({
  # Table Viewer (the data) or Variable Directory (what each column means).
  if (rv$view == "table") {
    div(class = "panel-card",
        div(class = "viewer-head", h3("Table Viewer"),
            span(class = "current", "Currently viewing: ", tags$strong(table_label()))),
        # Placeholder for the interactive table defined in output$data_table below.
        DTOutput("data_table"),
        div(class = "table-foot", textOutput("table_count")))
  } else {
    div(class = "panel-card",
        div(class = "viewer-head", h3("Variable Directory"),
            span(class = "current", "Table: ", tags$strong(table_label()))),
        DTOutput("dict_table"),
        div(class = "table-foot", "Each row describes one column (factor) of the selected table."))
  }
})

# The data table: filter boxes sit directly above each column, a search box above
# the table, scroll bars both ways, and "Showing x to y of N entries" at the bottom.
output$data_table <- renderDT({
  df <- current_df()
  # long text (e.g. DNA sequences) is shortened in the cell; hover to see all of it
  text_cols <- unname(which(vapply(df, is.character, logical(1)))) - 1
  # JavaScript that DataTables runs on each text cell: cut text longer than 60 characters and show
  # the full text as a hover tooltip. esc() makes odd characters safe to show.
  trim_js <- JS(r"(function(data, type, row) {
      // Only change what is DRAWN; sorting and searching still use the full text.
      if (type === 'display' && data != null && data.length > 60) {
        // esc(): replace characters that have special meaning in HTML.
        var esc = function(s) { return s.replace(/&/g,'&amp;').replace(/<\u002fg,'&lt;').replace(/"/g,'&quot;'); };
        // Shortened text; the title attribute is the hover tooltip.
        return '<span title="' + esc(data) + '">' + esc(data.substr(0, 60)) + '&hellip;<\u002fspan>';
      }
      // Anything short (or not being displayed) is returned unchanged.
      return data; }
  )")
  # Apply trim_js to the text columns only (nothing if there are none).
  defs <- if (length(text_cols)) list(list(targets = text_cols, render = trim_js)) else list()
  # filter = 'top' puts a filter box above each column; scrollX/scrollY add scroll bars; dom
  # 'lfrtip' = length menu, search box, table, 'Showing x to y of N' line, page buttons.
  datatable(df, rownames = FALSE, filter = "top", selection = "none", class = "stripe hover compact",
            options = list(scrollX = TRUE, scrollY = "52vh", scrollCollapse = TRUE,
                           pageLength = 25, lengthMenu = c(10, 25, 50, 100),
                           dom = "lfrtip", columnDefs = defs))
})
# Text under the table: number of rows (data points) and columns (factors).
output$table_count <- renderText({
  df <- current_df()
  sprintf("%s data points (rows) \u00d7 %d factors (columns) in this table.", format(nrow(df), big.mark = ","), ncol(df))
})

# Variable Directory: name, type, plain-English description, and quick facts
output$dict_table <- renderDT({
  df <- current_df(); key <- rv$table
  # One row per column of the table: name, type, description, % missing, distinct values, first 3
  # example values.
  info <- data.frame(
    Variable = names(df),
    Type = vapply(names(df), function(v) describe_type(v, df[[v]]), character(1)),
    Description = vapply(names(df), function(v) lookup_description(key, v), character(1)),
    `% Missing` = vapply(df, function(x) round(100 * mean(is.na(x)), 1), numeric(1)),
    `Distinct Values` = vapply(df, function(x) length(unique(stats::na.omit(x))), numeric(1)),
    `Example Values` = vapply(df, function(x) substr(paste(utils::head(unique(as.character(stats::na.omit(x))), 3), collapse = "; "), 1, 70), character(1)),
    check.names = FALSE, row.names = NULL)
  # Show it as a table; dom 'ftip' = search box, table, info line, page buttons.
  datatable(info, rownames = FALSE, selection = "none", class = "stripe hover compact",
            options = list(scrollX = TRUE, scrollY = "52vh", scrollCollapse = TRUE, pageLength = 50, dom = "ftip"))
})

# ---- [F6] Clicks in the viewer -------------------------------
observeEvent(input$pick_table, {                      # chose a different table
  req(input$pick_table %in% all_keys)
  rv$table <- input$pick_table
})
observeEvent(input$btn_desc, {                       # Description button: flip between table and directory
  rv$view <- if (rv$view == "description") "table" else "description"
})
observeEvent(input$btn_run,  { rv$mode <- "select"; rv$resp <- ""; rv$expl <- "" })   # open the variable picker (fresh)
observeEvent(input$btn_back, { rv$mode <- "browse"; rv$resp <- ""; rv$expl <- "" })   # back to the table selector

# The JavaScript tePick() reports which variable is ticked in each column
observeEvent(input$sel_pair, {
  req(rv$page == "viewer", rv$mode == "select")
  rv$resp <- input$sel_pair$resp
  rv$expl <- input$sel_pair$expl
})

observeEvent(input$btn_analyse, {                     # go to the results page
  req(!is.na(pair_test()))
  rv$analysis <- list(table = rv$table, resp = rv$resp, expl = rv$expl)
  rv$page <- "results"
})
observeEvent(input$btn_results_back, { rv$page <- "viewer" })

# ---- [F7] Background window ----------------------------------
observeEvent(input$btn_background, {
  # showModal() opens a pop-up window; easyClose lets people click outside it to close. The text
  # inside is ordinary HTML tags and can be edited freely.
  showModal(modalDialog(
    title = "Background", size = "l", easyClose = TRUE, footer = modalButton("Close"),
    h4("What is Tiny Earth?"),
    p("Tiny Earth is a student-sourced antibiotic discovery network led by the University of Wisconsin\u2013Madison. Students at schools around the world collect soil samples, isolate bacteria from them, and test those bacteria for antibiotic activity. The results from many schools are shared in the ",
      tags$a(href = "https://publicdata.tinyearth.wisc.edu/", target = "_blank", "Tiny Earth Public Database"), "."),
    h4("What is this app for?"),
    p("This app helps Bio 181 Lab students at BYU\u2013Idaho explore that public data and get a first taste of biostatistics, bioinformatics, and biological data science. You can browse and filter every table, then pick any two variables and the app chooses the right test for you:"),
    tags$ul(
      tags$li(tags$strong("Quantitative response + qualitative explanatory"), " \u2192 Analysis of Variance (ANOVA)"),
      tags$li(tags$strong("Quantitative + quantitative"), " \u2192 Simple Linear Regression"),
      tags$li(tags$strong("Qualitative + qualitative"), " \u2192 Chi-squared Test of Independence")),
    h4("How to use it"),
    tags$ol(
      tags$li("Pick a table in the Table Selector. Individual tables match the Tiny Earth database; Combined tables add the related sample and institution columns."),
      tags$li("Use the filter boxes above the Table Viewer to search and narrow the data. Use the Description button to see what each column means."),
      tags$li("Press Run Analysis, tick exactly two variables, then press Analyse."),
      tags$li("Read the graph and numerical summary. Open View More on Test for the test, its equations, and diagnostic checks. Learn More explains each test; Save PDF prints the page.")),
    p(class = "note", "All results are intended for academic and learning purposes.")))
})

# ---- [F8] RESULTS PAGE ---------------------------------------
# analysis_type(): "anova", "regression" or "chisq", decided by the TYPES of the
# Response and Explanatory variables chosen in the picker.
analysis_type <- reactive({
  # req() waits until an analysis has been requested.
  a  <- req(rv$analysis)
  # Load the table that was chosen.
  df <- load_table(a$table)
  pick_test(var_type(df[[a$resp]]), var_type(df[[a$expl]]))
})

# result() runs the matching test function (from the designer section above).
result <- reactive({
  a  <- req(rv$analysis)
  df <- load_table(a$table)
  tp <- analysis_type()
  validate(need(!is.na(tp), "No test matches a qualitative response with a quantitative explanatory variable. Go back and swap the columns."))
  switch(tp,
         anova      = analyse_anova(df, yvar = a$resp, gvar = a$expl),
         regression = analyse_regression(df, yvar = a$resp, xvar = a$expl),
         chisq      = analyse_chisq(df, a$expl, a$resp))     # rows = explanatory, columns = response
})

# Top bar (Back / Learn More / Save PDF) - built once per analysis
output$results_ui <- renderUI({
  a  <- req(rv$analysis)
  div(class = "panel-card results-page",
      div(class = "results-bar no-print",
          actionButton("btn_results_back", "\u2190 Back to Data", class = "btn-te btn-outline"),
          div(class = "spacer"),
          actionButton("btn_learn", "Learn More", class = "btn-te btn-cyan"),
          # "Save PDF" uses the browser's print window - choose "Save as PDF" as the printer
          tags$button(type = "button", class = "btn btn-te", onclick = "window.print();", "Save PDF")),
      p(class = "hint", paste("Table:", pretty_name(a$table), "\u00b7 Response (y):", a$resp, "\u00b7 Explanatory (x):", a$expl)),
      uiOutput("results_body"))
})

# results_body: everything under the top bar. result() is calculated once and shared with the plots.
output$results_body <- renderUI({
  # r = the named list returned by the matching analyse_* function.
  r <- result()
  div(
    h2(r$title),
    h3(class = "sec-title", "Graph"),
    plotOutput("res_plot", width = "780px", height = "440px"),
    h3(class = "sec-title", "Numerical Summary"),
    r$summary_ui,
    # The "View More on Test" drop-down: a button toggles the "open" class (see CSS).
    # When printing, the section is always shown.
    div(class = "more",
        tags$button(type = "button", class = "btn btn-te more-toggle no-print",
                    onclick = "this.parentNode.classList.toggle('open');", "View More on Test \u25be"),
        div(class = "more-body",
            h3(class = "sec-title", paste("About the Test:", test_info[[r$type]]$name)),
            info_ui(r$type),
            h3(class = "sec-title", "Test Results"), r$test_ui,
            h3(class = "sec-title", "Diagnostics"),
            div(class = "diag-row", lapply(seq_along(r$diag_plots), function(i)
              plotOutput(paste0("diag_plot_", i), width = "520px", height = "360px"))),
            r$diag_ui)))
})

# Plots use fixed sizes and suspendWhenHidden = FALSE so they are already drawn
# when the drop-down is opened or the page is printed.
output$res_plot <- renderPlot(result()$main_plot, width = 780, height = 440, res = 110)
outputOptions(output, "res_plot", suspendWhenHidden = FALSE)
# The two diagnostic plots are created in a loop; local() gives each pass its own copy of i.
for (i in 1:2) local({
  ii <- i; id <- paste0("diag_plot_", ii)
  # req() skips plot 2 for tests that only have one diagnostic plot (chi-squared).
  output[[id]] <- renderPlot({ r <- result(); req(length(r$diag_plots) >= ii); r$diag_plots[[ii]] },
                             width = 520, height = 360, res = 100)
  outputOptions(output, id, suspendWhenHidden = FALSE)
})

# ---- [F9] Learn More window ----------------------------------
observeEvent(input$btn_learn, {
  current <- analysis_type()
  if (is.na(current)) current <- "anova"
  order   <- c(current, setdiff(names(test_info), current))     # show the test you ran first
  showModal(modalDialog(
    title = "Learn More: The Three Tests", size = "l", easyClose = TRUE, footer = modalButton("Close"),
    p("The app picks the test from the types of the two variables you chose:"),
    tags$table(class = "te-table",
      tags$thead(tags$tr(tags$th("Variables chosen"), tags$th("Test used"))),
      tags$tbody(lapply(names(test_info), function(k) tags$tr(tags$td(test_info[[k]]$when), tags$td(test_info[[k]]$name))))),
    # One explanation block per test, with the test you just ran first.
    lapply(order, function(k) tagList(h4(class = "sec-title", test_info[[k]]$name), info_ui(k)))))
})
</script>
 
<script type="application/shiny-prerendered" data-context="server-extras">
ojs_define <- function(..., .session = shiny::getDefaultReactiveDomain()) {
  quos <- rlang::enquos(...)
  vars <- rlang::list2(...)
  nm <- names(vars)
  if (is.null(nm)) {
    nm <- rep_len("", length(vars))
  }
  mapply(
    function(q, nm, val) {
      # Infer name, if possible
      if (nm == "") {
        tryCatch(
          {
            nm <- rlang::as_name(q)
          },
          error = function(e) {
            code <- paste(collapse = "\n", deparse(rlang::f_rhs(q)))
            stop(
              "ojs_define() could not create a name for the argument: ",
              code
            )
          }
        )
      }
      .session$output[[nm]] <- val
      outputOptions(.session$output, nm, suspendWhenHidden = FALSE)
      .session$sendCustomMessage("ojs-export", list(name = nm))
      NULL
    },
    quos,
    nm,
    vars,
    SIMPLIFY = FALSE,
    USE.NAMES = FALSE
  )
  invisible()
}
</script>

  window.document.addEventListener("DOMContentLoaded", function (event) {
    const icon = "";

    };

      for (const clz of el.classList) {
        if (clz.startsWith('code-annotation-')) {                     
          return true;
        }
      }
      return false;
    }
    const onCopySuccess = function(e) {
      // button target
      const button = e.trigger;
      // don't keep focus
      button.blur();
      // flash "checked"
      button.classList.add('code-copy-button-checked');

      button.setAttribute("title", "Copied!");
      let tooltip;
      if (window.bootstrap) {
        button.setAttribute("data-bs-toggle", "tooltip");
        button.setAttribute("data-bs-placement", "left");
        button.setAttribute("data-bs-title", "Copied!");
        tooltip = new bootstrap.Tooltip(button, 
          { trigger: "manual", 
            customClass: "code-copy-button-tooltip",

      }
      setTimeout(function() {
        if (tooltip) {
          tooltip.hide();

    const getTextToCopy = function(trigger) {
      const outerScaffold = trigger.parentElement.cloneNode(true);
      const codeEl = outerScaffold.querySelector('code');
      for (const childEl of codeEl.children) {
        if (isCodeAnnotation(childEl)) {
          childEl.remove();
        }
      }
      return codeEl.innerText;
    }
    const clipboard = new window.ClipboardJS('.code-copy-button:not([data-in-quarto-modal])', {
      text: getTextToCopy
    });
    clipboard.on('success', onCopySuccess);

      const clipboardModal = new window.ClipboardJS('.code-copy-button[data-in-quarto-modal]', {
        text: getTextToCopy,

      });
      clipboardModal.on('success', onCopySuccess);
    }
      var localhostRegex = new RegExp(/^(?:http|https):\/\/localhost\:?[0-9]*\//);

      var isInternal = (href) => {

          if (link.dataset.originalHref !== undefined) {

    function tippyHover(el, contentFn, onTriggerFn, onUntriggerFn) {
      const config = {
        allowHTML: true,
        maxWidth: 500,
        delay: 100,
        arrow: false,
        appendTo: function(el) {
            return el.parentElement;
        },
        interactive: true,
        interactiveBorder: 10,
        theme: 'quarto',
        placement: 'bottom-start',
      };
      if (contentFn) {
        config.content = contentFn;
      }
      if (onTriggerFn) {
        config.onTrigger = onTriggerFn;
      }
      if (onUntriggerFn) {
        config.onUntrigger = onUntriggerFn;
      }
      window.tippy(el, config); 
    }
    const noterefs = window.document.querySelectorAll('a[role="doc-noteref"]');
    for (var i=0; i<noterefs.length; i++) {
      const ref = noterefs[i];
      tippyHover(ref, function() {
        // use id or data attribute instead here
        let href = ref.getAttribute('data-footnote-href') || ref.getAttribute('href');
        try { href = new URL(href).hash; } catch {}
        const id = href.replace(/^#\/?/, "");
        const note = window.document.getElementById(id);
        if (note) {
          return note.innerHTML;
        } else {
          return "";
        }
      });
    }
    const xrefs = window.document.querySelectorAll('a.quarto-xref');
    const processXRef = (id, note) => {
      // Strip column container classes
      const stripColumnClz = (el) => {
        el.classList.remove("page-full", "page-columns");
        if (el.children) {
          for (const child of el.children) {
            stripColumnClz(child);
          }
        }
      }
      stripColumnClz(note)
      if (id === null || id.startsWith('sec-')) {
        // Special case sections, only their first couple elements
        const container = document.createElement("div");
        if (note.children && note.children.length > 2) {
          container.appendChild(note.children[0].cloneNode(true));
          for (let i = 1; i < note.children.length; i++) {
            const child = note.children[i];
            if (child.tagName === "P" && child.innerText === "") {
              continue;
            } else {
              container.appendChild(child.cloneNode(true));
              break;
            }
          }
          if (window.Quarto?.typesetMath) {
            window.Quarto.typesetMath(container);
          }
          return container.innerHTML
        } else {
          if (window.Quarto?.typesetMath) {
            window.Quarto.typesetMath(note);
          }
          return note.innerHTML;
        }
      } else {
        // Remove any anchor links if they are present
        const anchorLink = note.querySelector('a.anchorjs-link');
        if (anchorLink) {
          anchorLink.remove();
        }
        if (window.Quarto?.typesetMath) {
          window.Quarto.typesetMath(note);
        }
        if (note.classList.contains("callout")) {
          return note.outerHTML;
        } else {
          return note.innerHTML;
        }
      }
    }
    for (var i=0; i<xrefs.length; i++) {
      const xref = xrefs[i];
      tippyHover(xref, undefined, function(instance) {
        instance.disable();
        let url = xref.getAttribute('href');
        let hash = undefined; 
        if (url.startsWith('#')) {
          hash = url;
        } else {
          try { hash = new URL(url).hash; } catch {}
        }
        if (hash) {
          const id = hash.replace(/^#\/?/, "");
          const note = window.document.getElementById(id);
          if (note !== null) {
            try {
              const html = processXRef(id, note.cloneNode(true));
              instance.setContent(html);
            } finally {
              instance.enable();
              instance.show();
            }
          } else {
            // See if we can fetch this
            fetch(url.split('#')[0])
            .then(res => res.text())
            .then(html => {
              const parser = new DOMParser();
              const htmlDoc = parser.parseFromString(html, "text/html");
              const note = htmlDoc.getElementById(id);
              if (note !== null) {
                const html = processXRef(id, note);
                instance.setContent(html);
              } 
            }).finally(() => {
              instance.enable();
              instance.show();
            });
          }
        } else {
          // See if we can fetch a full url (with no hash to target)
          // This is a special case and we should probably do some content thinning / targeting
          fetch(url)
          .then(res => res.text())
          .then(html => {
            const parser = new DOMParser();
            const htmlDoc = parser.parseFromString(html, "text/html");
            const note = htmlDoc.querySelector('main.content');
            if (note !== null) {
              // This should only happen for chapter cross references
              // (since there is no id in the URL)
              // remove the first header
              if (note.children.length > 0 && note.children[0].tagName === "HEADER") {
                note.children[0].remove();
              }
              const html = processXRef(null, note);
              instance.setContent(html);
            } 
          }).finally(() => {
            instance.enable();
            instance.show();
          });
        }
      }, function(instance) {
      });
    }
        let selectedAnnoteEl;
        const selectorForAnnotation = ( cell, annotation) => {
          let cellAttr = 'data-code-cell="' + cell + '"';
          let lineAttr = 'data-code-annotation="' +  annotation + '"';
          const selector = 'span[' + cellAttr + '][' + lineAttr + ']';
          return selector;
        }
        const selectCodeLines = (annoteEl) => {
          const doc = window.document;
          const targetCell = annoteEl.getAttribute("data-target-cell");
          const targetAnnotation = annoteEl.getAttribute("data-target-annotation");
          const annoteSpan = window.document.querySelector(selectorForAnnotation(targetCell, targetAnnotation));
          const lines = annoteSpan.getAttribute("data-code-lines").split(",");
          const lineIds = lines.map((line) => {
            return targetCell + "-" + line;
          })
          let top = null;
          let height = null;
          let parent = null;
          if (lineIds.length > 0) {
              //compute the position of the single el (top and bottom and make a div)
              const el = window.document.getElementById(lineIds[0]);
              top = el.offsetTop;
              height = el.offsetHeight;
              parent = el.parentElement.parentElement;
            if (lineIds.length > 1) {
              const lastEl = window.document.getElementById(lineIds[lineIds.length - 1]);
              const bottom = lastEl.offsetTop + lastEl.offsetHeight;
              height = bottom - top;
            }
            if (top !== null && height !== null && parent !== null) {
              // cook up a div (if necessary) and position it 
              let div = window.document.getElementById("code-annotation-line-highlight");
              if (div === null) {
                div = window.document.createElement("div");
                div.setAttribute("id", "code-annotation-line-highlight");
                div.style.position = 'absolute';
                parent.appendChild(div);
              }
              div.style.top = top - 2 + "px";
              div.style.height = height + 4 + "px";
              div.style.left = 0;
              let gutterDiv = window.document.getElementById("code-annotation-line-highlight-gutter");
              if (gutterDiv === null) {
                gutterDiv = window.document.createElement("div");
                gutterDiv.setAttribute("id", "code-annotation-line-highlight-gutter");
                gutterDiv.style.position = 'absolute';
                const codeCell = window.document.getElementById(targetCell);
                const gutter = codeCell.querySelector('.code-annotation-gutter');
                gutter.appendChild(gutterDiv);
              }
              gutterDiv.style.top = top - 2 + "px";
              gutterDiv.style.height = height + 4 + "px";
            }
            selectedAnnoteEl = annoteEl;
          }
        };
        const unselectCodeLines = () => {
          const elementsIds = ["code-annotation-line-highlight", "code-annotation-line-highlight-gutter"];
          elementsIds.forEach((elId) => {
            const div = window.document.getElementById(elId);
            if (div) {
              div.remove();
            }
          });
          selectedAnnoteEl = undefined;
        };
          // Handle positioning of the toggle
      window.addEventListener(
        "resize",
        throttle(() => {

          if (selectedAnnoteEl) {
            selectCodeLines(selectedAnnoteEl);
          }
        }, 10)
      );
      function throttle(fn, ms) {
      let throttle = false;
      let timer;
        return (...args) => {
          if(!throttle) { // first call gets through
              fn.apply(this, args);
              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
              timer = setTimeout(() => {
                fn.apply(this, args);
                timer = throttle = false;
              }, ms);
          }
        };
      }
        // Attach click handler to the DT
        const annoteDls = window.document.querySelectorAll('dt[data-target-cell]');
        for (const annoteDlNode of annoteDls) {
          annoteDlNode.addEventListener('click', (event) => {
            const clickedEl = event.target;
            if (clickedEl !== selectedAnnoteEl) {
              unselectCodeLines();
              const activeEl = window.document.querySelector('dt[data-target-cell].code-annotation-active');
              if (activeEl) {
                activeEl.classList.remove('code-annotation-active');
              }
              selectCodeLines(clickedEl);
              clickedEl.classList.add('code-annotation-active');
            } else {
              // Unselect the line
              unselectCodeLines();
              clickedEl.classList.remove('code-annotation-active');
            }
          });
        }

      const parentEl = el.parentElement;

        const cites = parentEl.dataset.cites;
        if (cites) {
          return {
